<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monsieur — Product</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap');

:root{
  --ink:#15151a; --ink-soft:#232329; --paper:#efe9dc; --paper-dim:#d9d2c1;
  --bordeaux:#7c2430; --bordeaux-soft:#9c3d49; --gold:#b8935a;
  --line:rgba(239,233,220,0.14); --line-strong:rgba(239,233,220,0.28);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3,.display{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

header{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:20px clamp(20px,4vw,56px); background:rgba(21,21,26,0.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.logo{ font-size:22px; letter-spacing:0.02em; }
.header-actions{ display:flex; align-items:center; gap:20px; font-size:13px; }
.btn-admin{ border:1px solid var(--line-strong); padding:9px 16px; border-radius:2px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.85; }
.cart-btn{ position:relative; }
.cart-count{ position:absolute; top:-8px; right:-10px; background:var(--bordeaux); color:var(--paper); font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

.breadcrumb{ padding:20px clamp(20px,4vw,56px) 0; font-size:12px; opacity:0.5; }
.breadcrumb a:hover{ opacity:0.8; }

.pdp{ display:grid; grid-template-columns:1fr 1fr; gap:56px; padding:32px clamp(20px,4vw,56px) 80px; align-items:start; }
@media (max-width:900px){ .pdp{ grid-template-columns:1fr; gap:32px; } }

.gallery-main{ aspect-ratio:4/5; border-radius:4px; overflow:hidden; margin-bottom:12px; }
.gallery-thumbs{ display:flex; gap:10px; flex-wrap:wrap; }
.gallery-thumbs .thumb{ width:64px; height:64px; border-radius:3px; border:1px solid var(--line-strong); cursor:pointer; opacity:0.6; }
.gallery-thumbs .thumb.active{ opacity:1; border-color:var(--gold); }

.pdp-info .cat{ font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
.pdp-info h1{ font-size:clamp(28px,3vw,38px); line-height:1.1; margin-bottom:12px; }
.pdp-rating{ font-size:13px; opacity:0.65; margin-bottom:18px; }
.pdp-price{ font-size:24px; display:flex; align-items:baseline; gap:12px; margin-bottom:20px; }
.pdp-price .was{ text-decoration:line-through; opacity:0.4; font-size:16px; }
.pdp-price .discount{ color:var(--gold); font-size:13px; }
.pdp-desc{ font-size:14px; line-height:1.75; opacity:0.75; margin-bottom:26px; }
.stock-line{ font-size:13px; margin-bottom:22px; display:flex; align-items:center; gap:8px; }
.stock-dot{ width:8px; height:8px; border-radius:50%; background:#7fc99a; }
.stock-dot.low{ background:var(--gold); }
.stock-dot.out{ background:var(--bordeaux); }
.qty-row{ display:flex; align-items:center; gap:16px; margin-bottom:18px; }
.qty-stepper{ display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:2px; }
.qty-stepper button{ padding:10px 14px; font-size:15px; }
.qty-stepper span{ min-width:32px; text-align:center; font-size:14px; }
.btn-primary{ background:var(--paper); color:var(--ink); padding:15px 28px; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; border-radius:2px; width:100%; font-weight:600; transition:transform 0.2s; }
.btn-primary:hover{ transform:translateY(-2px); }
.btn-primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
.meta-row{ display:flex; gap:22px; margin-top:26px; padding-top:22px; border-top:1px solid var(--line); font-size:12px; opacity:0.6; }

.section{ padding:0 clamp(20px,4vw,56px) 60px; }
.section h2{ font-size:22px; margin-bottom:22px; }

.reviews-summary{ display:flex; gap:32px; align-items:center; margin-bottom:28px; padding-bottom:24px; border-bottom:1px solid var(--line); }
.reviews-summary .big{ font-size:44px; font-family:'Fraunces',serif; }
.reviews-summary .stars{ color:var(--gold); font-size:15px; }
.review{ padding:18px 0; border-bottom:1px solid var(--line); }
.review-head{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
.review-head .stars{ color:var(--gold); }
.review-name{ font-weight:600; }
.review-body{ font-size:13px; opacity:0.75; line-height:1.6; }
.verified{ font-size:11px; color:#7fc99a; margin-left:8px; }
.empty-state{ opacity:0.5; font-size:13px; padding:20px 0; }

.related-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; }
.rcard .thumb{ aspect-ratio:4/5; border-radius:3px; margin-bottom:10px; }
.rcard .name{ font-size:14px; font-family:'Fraunces',serif; }
.rcard .price{ font-size:13px; opacity:0.7; margin-top:4px; }

.drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:60; opacity:0; pointer-events:none; transition:opacity 0.25s; }
.drawer-overlay.open{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; right:0; height:100%; width:min(380px,92vw); background:var(--ink-soft); z-index:61; transform:translateX(100%); transition:transform 0.3s ease; display:flex; flex-direction:column; border-left:1px solid var(--line); }
.drawer.open{ transform:translateX(0); }
.drawer-head{ padding:22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.drawer-body{ flex:1; overflow-y:auto; padding:18px 22px; }
.drawer-item{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:13px; }
.drawer-foot{ padding:22px; border-top:1px solid var(--line); }
.drawer-foot .total{ display:flex; justify-content:space-between; margin-bottom:14px; font-size:15px; }
</style>
</head>
<body>

<header>
  <a href="monsieur_shop.html" class="logo">Monsieur</a>
  <div class="header-actions">
    <a href="monsieur_login.html" class="btn-admin" id="accountLink">Sign in</a>
    <button class="cart-btn" onclick="toggleCart(true)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M6 6l-1-3H2"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="breadcrumb"><a href="monsieur_shop.html">Cravates</a> <span id="crumbCat"></span> / <span id="crumbName"></span></div>

<div id="pdpRoot"></div>

<section class="section">
  <h2>Reviews</h2>
  <div id="reviewsRoot"></div>
</section>

<section class="section">
  <h2>You may also like</h2>
  <div class="related-grid" id="relatedGrid"></div>
</section>

<div class="drawer-overlay" id="overlay" onclick="toggleCart(false)"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <strong class="display">Your bag</strong>
    <button onclick="toggleCart(false)">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <div class="total"><span>Total</span><strong id="cartTotal">EGP 0</strong></div>
    <button class="btn-primary" style="width:100%">Checkout</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
const slugParam = new URLSearchParams(window.location.search).get('slug');
let PRODUCT = null;
let GALLERY = [];
let activeImage = 0;
let qty = 1;

function patternStyle(p){
  const c = p.swatch_color || '#7c2430';
  if(p.pattern==='stripe') return `repeating-linear-gradient(115deg, ${c} 0 14px, #efe9dc22 14px 18px)`;
  if(p.pattern==='dot') return `radial-gradient(circle at 30% 30%, #efe9dc33 3px, transparent 4px) 0 0/22px 22px, ${c}`;
  if(p.pattern==='paisley') return `radial-gradient(ellipse at 40% 60%, #efe9dc22 8px, transparent 12px) 0 0/34px 34px, ${c}`;
  return c;
}
function effectivePrice(p){ return p.final_price ? p.final_price : p.price; }
function isOnSale(p){ return !!p.final_price && p.final_price < p.price; }

async function loadProduct(){
  if(!slugParam){ document.getElementById('pdpRoot').innerHTML = `<div class="section"><p>No product specified.</p></div>`; return; }

  // slug OR raw id — the shop links by slug when present, id otherwise
  let query = sb.from('products_public').select('*');
  const isUuid = /^[0-9a-f-]{36}$/i.test(slugParam);
  query = isUuid ? query.eq('id', slugParam) : query.eq('slug', slugParam);
  const { data, error } = await query.maybeSingle();

  if(error || !data){
    document.getElementById('pdpRoot').innerHTML = `<div class="section"><p>This product couldn't be found — it may be out of season.</p></div>`;
    return;
  }
  PRODUCT = data;
  document.title = `Monsieur — ${PRODUCT.name}`;
  document.getElementById('crumbCat').textContent = PRODUCT.category ? `/ ${PRODUCT.category}` : '';
  document.getElementById('crumbName').textContent = PRODUCT.name;

  const { data: media } = await sb.from('product_media').select('url').eq('product_id', PRODUCT.id).order('sort_order');
  GALLERY = [PRODUCT.main_image_url, ...(media||[]).map(m=>m.url)].filter(Boolean);
  if(!GALLERY.length) GALLERY = [null]; // fall back to the pattern swatch itself

  renderPDP();
  logView();
  loadReviews();
  loadRelated();
}

function renderPDP(){
  const p = PRODUCT;
  const sale = isOnSale(p);
  const soldOut = p.stock<=0;
  const stockClass = soldOut ? 'out' : (p.stock<=5 ? 'low' : '');
  const stockLabel = soldOut ? 'Out of stock' : (p.stock<=5 ? `Only ${p.stock} left` : 'In stock');

  document.getElementById('pdpRoot').innerHTML = `
    <div class="pdp">
      <div>
        <div class="gallery-main" id="galleryMain" style="background:${GALLERY[activeImage] ? `url('${GALLERY[activeImage]}') center/cover` : patternStyle(p)}"></div>
        ${GALLERY.length>1 ? `<div class="gallery-thumbs">${GALLERY.map((url,i)=>`
          <div class="thumb ${i===activeImage?'active':''}" style="background:${url?`url('${url}') center/cover`:patternStyle(p)}" onclick="setImage(${i})"></div>
        `).join('')}</div>` : ''}
      </div>
      <div class="pdp-info">
        <div class="cat">${p.category || 'Cravates'}</div>
        <h1>${p.name}</h1>
        <div class="pdp-rating">★ ${Number(p.rating||0).toFixed(1)} (${p.reviews||0} review${p.reviews===1?'':'s'})</div>
        <div class="pdp-price">
          <span>EGP ${effectivePrice(p).toLocaleString()}</span>
          ${sale ? `<span class="was">EGP ${p.price.toLocaleString()}</span><span class="discount">-${p.discount_percent}%</span>` : ''}
        </div>
        <p class="pdp-desc">${p.description || 'Hand-finished silk, woven in small batches.'}</p>
        <div class="stock-line"><span class="stock-dot ${stockClass}"></span> ${stockLabel}</div>
        <div class="qty-row">
          <div class="qty-stepper">
            <button onclick="changeQty(-1)">−</button>
            <span id="qtyVal">${qty}</span>
            <button onclick="changeQty(1)">+</button>
          </div>
        </div>
        <button class="btn-primary" ${soldOut?'disabled':''} onclick="addToBag()">${soldOut?'Sold out':'Add to bag'}</button>
        <div class="meta-row">
          <span>SKU: ${p.sku || p.hc_id || '—'}</span>
          <span>Ships in 2–4 business days</span>
        </div>
      </div>
    </div>`;
}

function setImage(i){ activeImage = i; renderPDP(); }
function changeQty(d){
  qty = Math.max(1, Math.min(PRODUCT.stock, qty + d));
  document.getElementById('qtyVal').textContent = qty;
}

function addToBag(){
  if(!PRODUCT || PRODUCT.stock<=0) return;
  cartAdd(PRODUCT, qty);
  updateCartUI();
  toggleCart(true);
}

function logView(){
  sb.from('product_views').insert({
    product_id: PRODUCT.id,
    was_out_of_stock: PRODUCT.stock<=0,
  }).then(({error})=>{ if(error) console.warn('view log failed', error); });
}

async function loadReviews(){
  const { data, error } = await sb.from('product_reviews_public')
    .select('*').eq('product_id', PRODUCT.id).order('created_at', { ascending:false }).limit(20);
  const root = document.getElementById('reviewsRoot');
  if(error || !data || !data.length){
    root.innerHTML = `<div class="empty-state">No reviews yet — be the first to review this piece.</div>`;
    return;
  }
  const avg = data.reduce((s,r)=>s+r.rating,0) / data.length;
  root.innerHTML = `
    <div class="reviews-summary">
      <div class="big">${avg.toFixed(1)}</div>
      <div>
        <div class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</div>
        <div style="font-size:12px; opacity:0.6; margin-top:4px;">${data.length} review${data.length===1?'':'s'}</div>
      </div>
    </div>
    ${data.map(r=>`
      <div class="review">
        <div class="review-head">
          <span><span class="review-name">${r.reviewer_name}</span>${r.is_verified_purchase?'<span class="verified">✓ Verified purchase</span>':''}</span>
          <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
        </div>
        ${r.title ? `<div style="font-size:13px; font-weight:600; margin-bottom:4px;">${r.title}</div>` : ''}
        <div class="review-body">${r.body || ''}</div>
      </div>
    `).join('')}`;
}

async function loadRelated(){
  let q = sb.from('products_public').select('*').neq('id', PRODUCT.id).limit(4);
  if(PRODUCT.category) q = q.eq('category', PRODUCT.category);
  const { data, error } = await q;
  const grid = document.getElementById('relatedGrid');
  if(error || !data || !data.length){ grid.innerHTML = ''; return; }
  grid.innerHTML = data.map(p=>`
    <a class="rcard" href="monsieur_pdp.html?slug=${encodeURIComponent(p.slug||p.id)}">
      <div class="thumb" style="background:${p.main_image_url?`url('${p.main_image_url}') center/cover`:patternStyle(p)}"></div>
      <div class="name">${p.name}</div>
      <div class="price">EGP ${effectivePrice(p).toLocaleString()}</div>
    </a>
  `).join('');
}

/* ---------- cart (shared with the shop via js/supabase-client.js) ---------- */
function updateCartUI(){
  const items = cartGet();
  document.getElementById('cartCount').textContent = cartCount(items);
  const body = document.getElementById('drawerBody');
  body.innerHTML = items.length ? items.map(i=>`
    <div class="drawer-item">
      <span>${i.name} ${i.qty>1?`× ${i.qty}`:''}</span>
      <span>EGP ${(i.price*i.qty).toLocaleString()}</span>
    </div>`).join('') : `<div class="empty-state">Your bag is empty.</div>`;
  document.getElementById('cartTotal').textContent = 'EGP ' + cartTotal(items).toLocaleString();
}
function toggleCart(open){
  document.getElementById('drawer').classList.toggle('open',open);
  document.getElementById('overlay').classList.toggle('open',open);
}

async function checkSession(){
  const session = await getSession();
  if(!session) return;
  const link = document.getElementById('accountLink');
  const name = session.user.user_metadata?.full_name || session.user.email;
  link.textContent = `Hi, ${name.split(' ')[0]}`;
  link.removeAttribute('href');
  link.style.cursor = 'pointer';
  link.onclick = async ()=>{ if(confirm('Sign out?')) await signOutAndRedirect('monsieur_shop.html'); };
}

updateCartUI();
checkSession();
loadProduct();

// live stock/price — reload if this product's row changes
sb.channel(`pdp:${slugParam}`)
  .on('postgres_changes', { event:'*', schema:'public', table:'products' }, loadProduct)
  .on('postgres_changes', { event:'*', schema:'public', table:'inventory' }, loadProduct)
  .subscribe();
</script>
</body>
</html>
