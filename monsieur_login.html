<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monsieur — Sign in</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap');
:root{
  --ink:#15151a; --paper:#efe9dc; --bordeaux:#7c2430; --gold:#b8935a;
  --line:rgba(239,233,220,0.14); --line-strong:rgba(239,233,220,0.28);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{ width:100%; max-width:380px; }
.logo{ font-family:'Fraunces',serif; font-size:24px; text-align:center; margin-bottom:8px; }
.sub{ text-align:center; color:var(--paper); opacity:0.6; font-size:13px; margin-bottom:32px; }
.tabs{ display:flex; border:1px solid var(--line-strong); border-radius:4px; overflow:hidden; margin-bottom:24px; }
.tabs button{ flex:1; padding:11px; background:transparent; border:none; color:var(--paper); opacity:0.6; font-size:13px; cursor:pointer; font-family:inherit; }
.tabs button.active{ background:var(--paper); color:var(--ink); opacity:1; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.55; margin-bottom:6px; }
.field input{
  width:100%; background:transparent; border:1px solid var(--line-strong); border-radius:3px;
  padding:11px 12px; color:var(--paper); font-size:14px; font-family:inherit;
}
.field input:focus{ outline:none; border-color:var(--gold); }
button.submit{
  width:100%; padding:13px; background:var(--paper); color:var(--ink); border:none; border-radius:3px;
  font-size:13px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; margin-top:8px; font-weight:600;
}
button.submit:disabled{ opacity:0.5; cursor:not-allowed; }
.msg{ font-size:12px; margin-top:14px; text-align:center; min-height:16px; }
.msg.err{ color:#e08585; }
.msg.ok{ color:#7fc99a; }
.back{ display:block; text-align:center; margin-top:24px; font-size:12px; opacity:0.5; text-decoration:none; color:inherit; }
.back:hover{ opacity:0.8; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Monsieur</div>
  <div class="sub">Sign in to your account</div>

  <div class="tabs">
    <button class="active" id="tabSignin" onclick="setMode('signin')">Sign in</button>
    <button id="tabSignup" onclick="setMode('signup')">Create account</button>
  </div>

  <form id="authForm">
    <div class="field" id="nameField" style="display:none">
      <label>Full name</label>
      <input type="text" id="fullName" placeholder="Your name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="••••••••">
    </div>
    <button type="submit" class="submit" id="submitBtn">Sign in</button>
    <div class="msg" id="msg"></div>
  </form>

  <a href="monsieur_shop.html" class="back">← Back to the shop</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
let mode = 'signin';
const params = new URLSearchParams(window.location.search);
const wantsAdmin = params.get('next') === 'admin';

function setMode(m){
  mode = m;
  document.getElementById('tabSignin').classList.toggle('active', m==='signin');
  document.getElementById('tabSignup').classList.toggle('active', m==='signup');
  document.getElementById('nameField').style.display = m==='signup' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = m==='signup' ? 'Create account' : 'Sign in';
  document.getElementById('msg').textContent = '';
}

async function routeAfterAuth(userId){
  const admin = await isStoreAdmin(userId);
  window.location.href = admin ? 'monsieur_admin.html' : 'monsieur_shop.html';
}

// If already signed in, skip straight to the right place.
(async ()=>{
  const session = await getSession();
  if(session) routeAfterAuth(session.user.id);
})();

document.getElementById('authForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = '';

  if(mode === 'signup'){
    const full_name = document.getElementById('fullName').value.trim();
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name } }
    });
    btn.disabled = false;
    if(error){ msg.className='msg err'; msg.textContent = error.message; return; }
    if(data.session){
      routeAfterAuth(data.user.id);
    }else{
      msg.className = 'msg ok';
      msg.textContent = 'Account created — check your email to confirm, then sign in.';
      setMode('signin');
    }
  }else{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if(error){ msg.className='msg err'; msg.textContent = error.message; return; }
    routeAfterAuth(data.user.id);
  }
});
</script>
</body>
</html>
